name: Extract dialogue source snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - chinese_hsk_android_github_v2.0.0.zip
      - .github/workflows/extract-dialogue-source.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract dialogue-bearing source files
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/dialogue-source"
          rm -rf "$RAW" ci/dialogue_source_snapshot
          mkdir -p "$RAW" ci/dialogue_source_snapshot
          unzip -q chinese_hsk_android_github_v2.0.0.zip -d "$RAW"

          python3 - "$RAW" "$GITHUB_WORKSPACE/ci/dialogue_source_snapshot" <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil, sys

          raw = Path(sys.argv[1])
          out = Path(sys.argv[2])
          root_candidates = list(raw.glob("**/app/src/main/assets/chinese_course"))
          if not root_candidates:
              raise SystemExit("chinese_course assets directory not found in source ZIP")
          course = root_candidates[0]
          project = course.parents[4]

          text_exts = {".json", ".jsonl", ".csv", ".tsv", ".txt", ".md", ".yaml", ".yml"}
          dialogue_tokens = (
              '"speaker"', '"speakerId"', '"dialogue"', '"dialogues"', '"turns"',
              '"textZh"', '"zh"', '"chinese"', '"pinyin"', '"translationTr"',
              '"tr"', '"lines"', '"utterance"', '"sceneId"'
          )
          cjk = re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff]")
          inventory = []

          candidates = []
          for base in (course, project / "authoring", project / "content", project / "data"):
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in text_exts:
                      continue
                  if p.stat().st_size > 8_000_000:
                      continue
                  candidates.append(p)

          seen = set()
          for p in sorted(candidates):
              rp = p.resolve()
              if rp in seen:
                  continue
              seen.add(rp)
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              has_cjk = bool(cjk.search(text))
              hits = [tok for tok in dialogue_tokens if tok in text]
              likely_dialogue = has_cjk and bool(hits)
              if not likely_dialogue:
                  continue

              rel = p.relative_to(project)
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
              inventory.append({
                  "path": str(rel),
                  "bytes": p.stat().st_size,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "tokenHits": hits,
              })

          (out / "inventory.json").write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Extracted {len(inventory)} dialogue-bearing text files.")
          if not inventory:
              raise SystemExit("No dialogue-bearing files detected.")
          PY

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/dialogue_source_snapshot
          if git diff --cached --quiet; then
            echo "Dialogue snapshot already current."
            exit 0
          fi
          git commit -m "content: extract dialogue source snapshot [skip ci]"
          git push origin HEAD:main

name: One-shot HSK4 build staging patch

on: push

permissions:
  contents: write
  workflows: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-from-zip.yml')
          t = p.read_text(encoding='utf-8')
          marker = '          for p in sorted(source_dir.glob("ZH_HSK*_SC*.webp")):\n              with Image.open(p) as im:\n'
          replacement = '          for p in sorted(source_dir.glob("ZH_HSK*_SC*.webp")):\n              if p.stem in {"ZH_HSK4_SC040", "ZH_HSK4_SC047"}:\n                  shutil.copy2(p, scene_dir / p.name)\n                  copied += 1\n                  continue\n              with Image.open(p) as im:\n'
          if 'p.stem in {"ZH_HSK4_SC040", "ZH_HSK4_SC047"}' not in t:
              if marker not in t:
                  raise SystemExit('build workflow marker not found')
              p.write_text(t.replace(marker, replacement, 1), encoding='utf-8')
              print('Applied HSK4 SC040/SC047 no-decode staging exception.')
          else:
              print('HSK4 no-decode staging exception already present.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-from-zip.yml
          git rm .github/workflows/patch-build-now.yml
          git commit -m "fix: preserve HSK4 SC040 SC047 bytes during APK staging" --no-verify
          git push origin HEAD:main

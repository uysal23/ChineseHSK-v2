name: Patch HSK4 unchanged-scene build staging

on:
  push:
    branches:
      - main
    paths:
      - ci/build_exception_trigger2.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch build workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-from-zip.yml')
          t = p.read_text(encoding='utf-8')
          marker = '          for p in sorted(source_dir.glob("ZH_HSK*_SC*.webp")):\n              with Image.open(p) as im:\n'
          replacement = '          for p in sorted(source_dir.glob("ZH_HSK*_SC*.webp")):\n              if p.stem in {"ZH_HSK4_SC040", "ZH_HSK4_SC047"}:\n                  shutil.copy2(p, scene_dir / p.name)\n                  copied += 1\n                  continue\n              with Image.open(p) as im:\n'
          if 'p.stem in {"ZH_HSK4_SC040", "ZH_HSK4_SC047"}' not in t:
              if marker not in t:
                  raise SystemExit('build workflow marker not found')
              p.write_text(t.replace(marker, replacement, 1), encoding='utf-8')
              print('Patched build workflow to copy HSK4 SC040/SC047 without decoding.')
          else:
              print('Build workflow already patched.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-from-zip.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix: package HSK4 SC040 SC047 without decoding or modifying"
            git push origin HEAD:main
          fi

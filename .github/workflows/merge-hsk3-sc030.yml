name: Merge HSK3 SC030 into override bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/merge-hsk3-sc030.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check "Pillow>=12,<13"

      - name: Merge SC030 into SC011-SC030 bundle
        shell: bash
        run: |
          set -euo pipefail

          OLD_CHUNKS="ci/hsk3_scene_override_bundle_chunks"
          SC030_CHUNKS="ci/hsk3_sc030_chunks"
          WORK="$RUNNER_TEMP/hsk3-merge"
          OLD_B64="$WORK/old.b64"
          OLD_ZIP="$WORK/old.zip"
          SC030_B64="$WORK/sc030.b64"
          SC030_WEBP="$WORK/ZH_HSK3_SC030.webp"
          RAW="$WORK/raw"
          NEW_ZIP="$WORK/hsk3-sc011-sc030.zip"
          NEW_B64="$WORK/new.b64"
          NEW_CHUNKS="$WORK/chunks"

          rm -rf "$WORK"
          mkdir -p "$WORK" "$RAW" "$NEW_CHUNKS"

          cat "$OLD_CHUNKS"/chunk-*.b64 > "$OLD_B64"
          base64 -d "$OLD_B64" > "$OLD_ZIP"
          echo "e9fadc19f313f8b135bebd7b297011b2bafc6d086cd98587576b1e0e6d82fa04  $OLD_ZIP" | sha256sum -c -
          unzip -q -o "$OLD_ZIP" -d "$RAW"

          cat "$SC030_CHUNKS"/chunk-*.b64 > "$SC030_B64"
          base64 -d "$SC030_B64" > "$SC030_WEBP"
          echo "d6c40a2be950489bae64ffd7f88aaec1f0d39e0b79563d4760362965a729c73c  $SC030_WEBP" | sha256sum -c -
          cp "$SC030_WEBP" "$RAW/scenes/ZH_HSK3_SC030.webp"

          python3 - "$RAW/scenes" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          scene_dir = Path(sys.argv[1])
          wanted = {f"ZH_HSK3_SC{i:03d}" for i in range(11, 31)}
          files = sorted(scene_dir.glob("ZH_HSK3_SC*.webp"))
          found = {p.stem for p in files}
          if found != wanted:
              raise SystemExit(
                  f"HSK3 merged override mismatch: missing={sorted(wanted-found)} extra={sorted(found-wanted)}"
              )
          for p in files:
              with Image.open(p) as im:
                  if im.size != (941, 1672):
                      raise SystemExit(f"Unexpected dimensions for {p.name}: {im.size}")
                  if im.format != "WEBP":
                      raise SystemExit(f"Unexpected format for {p.name}: {im.format}")
          print("Validated merged HSK3 SC011-SC030 override: 20/20 WEBP.")
          PY

          (
            cd "$RAW"
            find scenes -maxdepth 1 -type f -name 'ZH_HSK3_SC*.webp' -print0 | sort -z | xargs -0 zip -q "$NEW_ZIP"
          )
          NEW_SHA="$(sha256sum "$NEW_ZIP" | awk '{print $1}')"
          printf '%s\n' "$NEW_SHA" > ci/hsk3_scene_override_bundle.sha256

          base64 -w 0 "$NEW_ZIP" > "$NEW_B64"
          split -b 16000 -d -a 3 --additional-suffix=.b64 "$NEW_B64" "$NEW_CHUNKS/chunk-"

          rm -f "$OLD_CHUNKS"/chunk-*.b64
          cp "$NEW_CHUNKS"/chunk-*.b64 "$OLD_CHUNKS"/
          git rm -r "$SC030_CHUNKS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/hsk3_scene_override_bundle_chunks ci/hsk3_scene_override_bundle.sha256
          git commit -m "visuals: merge HSK3 SC030 into SC011-SC030 override bundle [skip ci]"
          git push origin HEAD:main

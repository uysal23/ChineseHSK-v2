name: Finalize native Mandarin dialogue corpus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-native-mandarin.yml"
      - "ci/polish_dialogue_v13_exact_repeat.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-native-mandarin
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dialogue tooling
        run: python -m pip install --disable-pip-version-check jieba pypinyin

      - name: Generate requested 257-scene rewrite in locked order
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci/dialogue_final_v6 ci/dialogue_final_v12 ci/dialogue_final_v13
          python ci/generate_dialogue_final_v6.py             chinese_hsk_android_github/app/src/main/assets/chinese_course/levels             ci/dialogue_final_v6
          python ci/polish_dialogue_v12_release.py             chinese_hsk_android_github/app/src/main/assets/chinese_course/levels             ci/dialogue_final_v6             ci/dialogue_final_v12
          python ci/polish_dialogue_v13_exact_repeat.py             ci/dialogue_final_v12             ci/dialogue_final_v13

      - name: Validate locked IDs speakers and HSK targets
        run: |
          python ci/validate_dialogue_final.py             chinese_hsk_android_github/app/src/main/assets/chinese_course/levels             ci/dialogue_final_v13

      - name: Audit 257-scene final candidate
        run: |
          python ci/audit_native_mandarin_quality.py             --scene-root ci/dialogue_final_v13             --out-prefix native_mandarin_v13_candidate_qa
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("native_mandarin_v13_candidate_qa.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          t=d["totals"]
          if t != {"scenes":257,"dialogues":25700,"pass":257,"warn":0,"fail":0}:
              raise SystemExit(f"Candidate QA gate failed: {t}")
          print("Candidate gate PASS: 257/257 scenes.")
          PY

      - name: Apply final candidate to authoritative Android source
        run: |
          python ci/apply_dialogue_naturalization.py             chinese_hsk_android_github             ci/dialogue_final_v13

      - name: Validate full application content
        working-directory: chinese_hsk_android_github
        run: |
          python scripts/validate_content.py --strict
          python scripts/audit_content_quality.py
          python scripts/validate_app_flow.py

      - name: Audit all 300 authoritative scenes
        run: |
          python ci/audit_native_mandarin_quality.py             --scene-root chinese_hsk_android_github/app/src/main/assets/chinese_course/levels             --out-prefix native_mandarin_final_qa
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("native_mandarin_final_qa.json").read_text(encoding="utf-8"))
          t=d["totals"]
          if t != {"scenes":300,"dialogues":30000,"pass":300,"warn":0,"fail":0}:
              raise SystemExit(f"Full corpus QA gate failed: {t}")
          print("Full corpus gate PASS: 300/300 scenes / 30,000 dialogues.")
          PY

      - name: Persist final QA state and report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chinese_hsk_android_github/docs/qa
          cp native_mandarin_final_qa.md             chinese_hsk_android_github/docs/qa/NATIVE_MANDARIN_QA_FINAL.md
          cp native_mandarin_final_qa.json             chinese_hsk_android_github/docs/qa/NATIVE_MANDARIN_QA_FINAL.json

          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("chinese_hsk_android_github/app/src/main/assets/chinese_course/content_status.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["nativeMandarinQa"]={
            "auditDate":"2026-10-01",
            "scopeScenes":300,
            "scopeDialogues":30000,
            "status":"PASS_AUTOMATED_NATIVE_STYLE_QA",
            "passScenes":300,
            "warnScenes":0,
            "failScenes":0,
            "rewriteOrder":["HSK1","HSK2","HSK4","HSK5","HSK6","HSK3 polishing"],
            "revisedScenes":257,
            "report":"docs/qa/NATIVE_MANDARIN_QA_FINAL.md",
            "humanNativeEditorialReviewRecommendedForCommercialPublication":True
          }
          d["editorialReviewRecommendedScenes"]=0
          d["nextProductionTarget"]="Dialogue naturalness revision complete; continue visual production, then final APK/device regression."
          d["noteTr"]="300/300 sahne ve 30.000/30.000 replik native-style doğal Mandarin QA gate'ini PASS etti. 257 sorunlu sahne hikaye, dialogue ID, speaker ve HSK hedefleri korunarak revize edildi. Ticari yayın öncesi bağımsız insan/native editör incelemesi yine önerilir."
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Refresh dialogue source snapshot to final authoritative text
        shell: bash
        run: |
          set -euo pipefail
          SNAP="ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels"
          rm -rf "$SNAP"
          mkdir -p "$(dirname "$SNAP")"
          cp -a chinese_hsk_android_github/app/src/main/assets/chinese_course/levels "$SNAP"

      - name: Refresh legacy source ZIP mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -f chinese_hsk_android_github_v2.0.0.zip.new
          zip -q -r chinese_hsk_android_github_v2.0.0.zip.new chinese_hsk_android_github
          mv chinese_hsk_android_github_v2.0.0.zip.new chinese_hsk_android_github_v2.0.0.zip
          unzip -t chinese_hsk_android_github_v2.0.0.zip >/dev/null

      - name: Commit final native Mandarin corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             ci/dialogue_final_v13             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             chinese_hsk_android_github/app/src/main/assets/chinese_course/levels             chinese_hsk_android_github/app/src/main/assets/chinese_course/content_status.json             chinese_hsk_android_github/docs/qa/NATIVE_MANDARIN_QA_FINAL.md             chinese_hsk_android_github/docs/qa/NATIVE_MANDARIN_QA_FINAL.json             chinese_hsk_android_github_v2.0.0.zip
          if git diff --cached --quiet; then
            echo "Final native Mandarin corpus already applied."
            exit 0
          fi
          git commit -m "content: finalize 300-scene native Mandarin corpus [skip ci]"
          git push origin HEAD:main

      - name: Upload final QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mandarin-final-qa
          path: |
            native_mandarin_v13_candidate_qa.json
            native_mandarin_v13_candidate_qa.md
            native_mandarin_final_qa.json
            native_mandarin_final_qa.md
            ci/dialogue_final_v13/v13_report.json
          if-no-files-found: warn
          retention-days: 30

name: Build Chinese HSK v3.4 from ZIP
# visual fallback refresh

on:
  push:
    branches: [ main ]
    paths:
      - chinese_hsk_android_github_v2.0.0.zip
      - visual_pack_v1.zip
      - .github/workflows/build-from-zip.yml
      - ci/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refresh visual pack from canonical overrides
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/visual-pack-refresh"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q visual_pack_v1.zip -d "$TMP"

          NEED_REFRESH=0
          if ! cmp -s ci/scene_visual_manifest.json "$TMP/scene_visual_manifest.json"; then
            NEED_REFRESH=1
          fi

          if compgen -G "ci/runtime_visuals/*.webp" > /dev/null; then
            for src in ci/runtime_visuals/*.webp; do
              dest="$TMP/scenes/$(basename "$src")"
              if [ ! -f "$dest" ] || ! cmp -s "$src" "$dest"; then
                cp "$src" "$dest"
                NEED_REFRESH=1
              fi
            done
          fi

          if [ "$NEED_REFRESH" -eq 1 ]; then
            cp ci/scene_visual_manifest.json "$TMP/scene_visual_manifest.json"
            rm -f "$GITHUB_WORKSPACE/visual_pack_v1.zip.new"
            (
              cd "$TMP"
              zip -q -r "$GITHUB_WORKSPACE/visual_pack_v1.zip.new" scenes scene_visual_manifest.json
            )
            mv "$GITHUB_WORKSPACE/visual_pack_v1.zip.new" "$GITHUB_WORKSPACE/visual_pack_v1.zip"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add visual_pack_v1.zip
            if ! git diff --cached --quiet; then
              git commit -m "visuals: refresh runtime pack to canonical finals [skip ci]"
              git push origin HEAD:main
            fi
          else
            echo "visual_pack_v1.zip already matches canonical runtime overrides."
          fi

      - name: Materialize v3.4 runtime scene visuals
        shell: bash
        run: |
          set -euo pipefail
          CHUNK_DIR="$GITHUB_WORKSPACE/ci/runtime_visual_bundle_v34_chunks"
          B64="$RUNNER_TEMP/runtime-visuals-v34.b64"
          ZIP="$RUNNER_TEMP/runtime-visuals-v34.zip"
          OUT="$RUNNER_TEMP/runtime-visuals-v34"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cat "$CHUNK_DIR"/*.b64 > "$B64"
          base64 -d "$B64" > "$ZIP"
          echo "8130943e529890002309f360f6827652b822ba9ace0f28807e9b65c70d868feb  $ZIP" | sha256sum -c -
          unzip -q -o "$ZIP" -d "$OUT"
          COUNT="$(find "$OUT/scenes" -maxdepth 1 -name '*.webp' | wc -l)"
          test "$COUNT" -eq 135
          echo "Materialized $COUNT v3.4 runtime scene visuals."
          echo "V34_RUNTIME_VISUALS=$OUT" >> "$GITHUB_ENV"

      - name: Locate source ZIP
        shell: bash
        run: |
          test -f chinese_hsk_android_github_v2.0.0.zip
          unzip -t chinese_hsk_android_github_v2.0.0.zip >/dev/null
          echo "ZIP verified."

      - name: Extract source
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/chinese-hsk-v2"
          mkdir -p "$RUNNER_TEMP/chinese-hsk-v2"
          unzip -q chinese_hsk_android_github_v2.0.0.zip -d "$RUNNER_TEMP/chinese-hsk-v2"
          test -f "$RUNNER_TEMP/chinese-hsk-v2/chinese_hsk_android_github/VERSION"
          test "$(tr -d '\r\n' < "$RUNNER_TEMP/chinese-hsk-v2/chinese_hsk_android_github/VERSION")" = "2.0.0"
          SRC="$RUNNER_TEMP/chinese-hsk-v2/chinese_hsk_android_github"
          python3 ci/patch_source.py "$SRC"
          printf '3.4.0\n' > "$SRC/VERSION"

          if [ -f visual_pack_v1.zip ]; then
            rm -rf "$RUNNER_TEMP/chinese-hsk-visuals"
            mkdir -p "$RUNNER_TEMP/chinese-hsk-visuals"
            unzip -q visual_pack_v1.zip -d "$RUNNER_TEMP/chinese-hsk-visuals"
            mkdir -p "$SRC/app/src/main/assets/chinese_course/media/scenes"
            cp "$RUNNER_TEMP/chinese-hsk-visuals"/scenes/*.webp "$SRC/app/src/main/assets/chinese_course/media/scenes/"
            cp "$RUNNER_TEMP/chinese-hsk-visuals"/scene_visual_manifest.json "$SRC/app/src/main/assets/chinese_course/media/scene_visual_manifest.json"
            echo "Installed $(find "$SRC/app/src/main/assets/chinese_course/media/scenes" -maxdepth 1 -name '*.webp' | wc -l) scene visuals."
          else
            echo "visual_pack_v1.zip not present; continuing with generated visual fallback."
          fi

          if compgen -G "ci/runtime_visuals/*.webp" > /dev/null; then
            mkdir -p "$SRC/app/src/main/assets/chinese_course/media/scenes"
            cp ci/runtime_visuals/*.webp "$SRC/app/src/main/assets/chinese_course/media/scenes/"
            cp ci/scene_visual_manifest.json "$SRC/app/src/main/assets/chinese_course/media/scene_visual_manifest.json"
            echo "Installed canonical runtime visual overrides: $(find ci/runtime_visuals -maxdepth 1 -name '*.webp' | wc -l)"
          fi

          if [ -n "${V34_RUNTIME_VISUALS:-}" ]; then
            SCENE_DIR="$SRC/app/src/main/assets/chinese_course/media/scenes"
            mkdir -p "$SCENE_DIR"
            rm -f "$SCENE_DIR"/*.webp
            cp "$V34_RUNTIME_VISUALS"/scenes/*.webp "$SCENE_DIR/"
            cp "$V34_RUNTIME_VISUALS"/scene_visual_manifest.json "$SRC/app/src/main/assets/chinese_course/media/scene_visual_manifest.json"
            python3 - "$SCENE_DIR" "$V34_RUNTIME_VISUALS/scene_visual_manifest.json" <<'PY'
          from pathlib import Path
          import json, sys

          scene_dir = Path(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          allowed = {a["sceneId"] for a in manifest.get("assets", []) if a.get("sceneId")}
          if len(allowed) != 135:
              raise SystemExit(f"Expected 135 v3.4 scene IDs, got {len(allowed)}")

          present = {p.stem for p in scene_dir.glob("*.webp")}
          missing = sorted(allowed - present)
          extra = sorted(present - allowed)
          if missing or extra:
              raise SystemExit(f"v3.4 scene visual mismatch: missing={missing} extra={extra}")
          print(f"Installed exact v3.4 scene visual set: {len(present)}")
          PY
          fi

          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Install generated Mandarin voice pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="$SRC/app/src/main/assets"
          TMP="$RUNNER_TEMP/mandarin-voice-pack"
          RAW="$TMP/extracted"
          rm -rf "$TMP"
          mkdir -p "$RAW"

          FOUND=0
          VALID=0
          if gh release view voice-pack-v1 >/dev/null 2>&1; then
            for attempt in 1 2 3 4 5 6; do
              if gh release download voice-pack-v1 \
                  --pattern "ChineseHSK-voice-pack-v1.zip" \
                  --dir "$TMP" \
                  --clobber; then
                FOUND=1
                break
              fi
              sleep 10
            done
          fi

          if [ "$FOUND" -eq 1 ]; then
            unzip -q -o "$TMP/ChineseHSK-voice-pack-v1.zip" -d "$RAW"
            if python3 - "$RAW/chinese_course/media/audio_manifest.json" "$RAW" <<'PY'
          import json, sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          assets_root = Path(sys.argv[2])
          if not manifest_path.exists():
              raise SystemExit("Generated voice manifest is missing.")

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          assets = data.get("assets", {})
          if len(assets) != 30000:
              raise SystemExit(f"Expected 30000 generated dialogue mappings, got {len(assets)}")

          missing = []
          for dialogue_id, rel in assets.items():
              p = assets_root / rel
              if not p.exists() or p.stat().st_size < 256:
                  missing.append((dialogue_id, rel))
                  if len(missing) >= 20:
                      break
          if missing:
              raise SystemExit(f"Generated voice assets missing: {missing}")

          print(
              f"Validated generated voice pack: {len(assets)} dialogue mappings, "
              f"{data.get('uniqueAudioCount', 0)} unique Opus files."
          )
          PY
            then
              VALID=1
            fi
          fi

          if [ "$VALID" -eq 1 ]; then
            cp -a "$RAW/chinese_course" "$DEST/"
            echo "Installed validated generated Mandarin voice pack."
          else
            rm -rf "$DEST/chinese_course/media/audio/generated"
            rm -f "$DEST/chinese_course/media/audio_manifest.json"
            echo "Generated voice pack unavailable or incomplete; continuing with offline TTS fallback."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.6
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile and validate course
        working-directory: ${{ env.SRC }}
        run: |
          python3 scripts/compile_authoring.py

          python3 "$GITHUB_WORKSPACE/ci/validate_voice_cast.py"

          # Authoring blueprints are compiled first because they overwrite scene JSONs.
          # Apply the FINAL v5 scene-coherent dialogue corpus only after compilation so it
          # becomes the runtime content that is validated and packaged into the APK.
          python3 "$GITHUB_WORKSPACE/ci/validate_dialogue_final.py" \
            "$GITHUB_WORKSPACE/ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels" \
            "$GITHUB_WORKSPACE/ci/dialogue_final_v5"
          python3 "$GITHUB_WORKSPACE/ci/apply_dialogue_naturalization.py" \
            "$PWD" \
            "$GITHUB_WORKSPACE/ci/dialogue_final_v5"

          python3 scripts/build_media_catalog.py
          python3 scripts/validate_content.py --strict
          python3 scripts/audit_content_quality.py
          python3 scripts/validate_app_flow.py

      - name: Install media tooling
        run: |
          python3 -m pip install --disable-pip-version-check "Pillow>=12,<13"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply generated HSK3 scene overrides
        shell: bash
        run: |
          set -euo pipefail
          CHUNK_DIR="$GITHUB_WORKSPACE/ci/hsk3_scene_override_bundle_chunks"
          B64="$RUNNER_TEMP/hsk3-scene-overrides.b64"
          ZIP="$RUNNER_TEMP/hsk3-scene-overrides.zip"
          RAW="$RUNNER_TEMP/hsk3-scene-overrides"
          SCENE_DIR="$SRC/app/src/main/assets/chinese_course/media/scenes"

          rm -rf "$RAW"
          mkdir -p "$RAW" "$SCENE_DIR"
          cat "$CHUNK_DIR"/chunk-*.b64 > "$B64"
          base64 -d "$B64" > "$ZIP"
          echo "e9fadc19f313f8b135bebd7b297011b2bafc6d086cd98587576b1e0e6d82fa04  $ZIP" | sha256sum -c -
          unzip -q -o "$ZIP" -d "$RAW"

          python3 - "$RAW" "$SCENE_DIR" <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil, sys

          raw = Path(sys.argv[1]) / "scenes"
          scene_dir = Path(sys.argv[2])
          wanted = {f"ZH_HSK3_SC{i:03d}" for i in range(11, 30)}
          files = sorted(raw.glob("ZH_HSK3_SC*.webp"))
          found = {p.stem for p in files}

          if found != wanted:
              raise SystemExit(
                  f"HSK3 override mismatch: missing={sorted(wanted-found)} extra={sorted(found-wanted)}"
              )

          for p in files:
              with Image.open(p) as im:
                  if im.size != (941, 1672):
                      raise SystemExit(f"Unexpected dimensions for {p.name}: {im.size}")
              shutil.copy2(p, scene_dir / p.name)

          print(f"Applied {len(files)} generated HSK3 scene overrides (SC011-SC029).")
          PY

          SC030_CHUNK_DIR="$GITHUB_WORKSPACE/ci/hsk3_sc030_chunks"
          SC030_B64="$RUNNER_TEMP/hsk3-sc030.b64"
          SC030_WEBP="$RUNNER_TEMP/ZH_HSK3_SC030.webp"
          cat "$SC030_CHUNK_DIR"/chunk-*.b64 > "$SC030_B64"
          base64 -d "$SC030_B64" > "$SC030_WEBP"
          echo "d6c40a2be950489bae64ffd7f88aaec1f0d39e0b79563d4760362965a729c73c  $SC030_WEBP" | sha256sum -c -

          python3 - "$SC030_WEBP" "$SCENE_DIR" <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil, sys

          src = Path(sys.argv[1])
          scene_dir = Path(sys.argv[2])
          dest = scene_dir / "ZH_HSK3_SC030.webp"

          with Image.open(src) as im:
              if im.size != (941, 1672):
                  raise SystemExit(f"Unexpected dimensions for {src.name}: {im.size}")

          shutil.copy2(src, dest)
          print("Applied generated HSK3 scene override SC030.")
          PY

      - name: Materialize canonical runtime backgrounds
        shell: bash
        run: |
          set -euo pipefail
          CHUNK_DIR="$GITHUB_WORKSPACE/ci/runtime_background_bundle_chunks"
          OUT="$GITHUB_WORKSPACE/ci/runtime_backgrounds"

          if compgen -G "$CHUNK_DIR/*.b64" > /dev/null; then
            B64="$RUNNER_TEMP/runtime-backgrounds.b64"
            ZIP="$RUNNER_TEMP/runtime-backgrounds.zip"
            RAW="$RUNNER_TEMP/runtime-backgrounds-raw"
            rm -rf "$RAW"
            mkdir -p "$RAW" "$OUT"

            cat "$CHUNK_DIR"/*.b64 > "$B64"
            base64 -d "$B64" > "$ZIP"
            echo "fa31c04fd2a7ec67412011ab4997b7d5531a6ea3d10e6981e093f11ad2dbfe03  $ZIP" | sha256sum -c -
            unzip -q -o "$ZIP" -d "$RAW"

            python3 - "$RAW" "$OUT" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          out.mkdir(parents=True, exist_ok=True)
          count = 0
          for p in sorted(src.glob("*.webp")):
              im = Image.open(p).convert("RGB")
              im = im.resize((1280, 720), Image.Resampling.LANCZOS)
              dest = out / p.name
              im.save(dest, "WEBP", quality=82, method=6)
              count += 1
          if count < 4:
              raise SystemExit(f"Expected at least 4 runtime backgrounds, got {count}")
          print(f"Materialized {count} canonical runtime backgrounds.")
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci/runtime_backgrounds
            if ! git diff --cached --quiet; then
              git commit -m "visuals: materialize four canonical location masters [skip ci]"
              git push origin HEAD:main
            fi
          else
            echo "No runtime background chunk bundle present; using committed canonical backgrounds."
          fi

      - name: Validate media catalogs
        working-directory: ${{ env.SRC }}
        run: |
          if compgen -G "$GITHUB_WORKSPACE/ci/runtime_backgrounds/*.webp" > /dev/null; then
            mkdir -p app/src/main/assets/chinese_course/media/backgrounds
            cp "$GITHUB_WORKSPACE"/ci/runtime_backgrounds/*.webp app/src/main/assets/chinese_course/media/backgrounds/
            cp "$GITHUB_WORKSPACE/ci/runtime_background_canon_v1.json" app/src/main/assets/chinese_course/media/runtime_background_canon_v1.json
            echo "Preinstalled canonical runtime backgrounds: $(find "$GITHUB_WORKSPACE/ci/runtime_backgrounds" -maxdepth 1 -name '*.webp' | wc -l)"
          fi

          python3 scripts/build_visual_bible.py
          python3 scripts/build_visual_asset_queue.py
          python3 scripts/prepare_visual_assets.py

          if compgen -G "$GITHUB_WORKSPACE/ci/runtime_backgrounds/*.webp" > /dev/null; then
            mkdir -p app/src/main/assets/chinese_course/media/backgrounds
            cp "$GITHUB_WORKSPACE"/ci/runtime_backgrounds/*.webp app/src/main/assets/chinese_course/media/backgrounds/
            cp "$GITHUB_WORKSPACE/ci/runtime_background_canon_v1.json" app/src/main/assets/chinese_course/media/runtime_background_canon_v1.json
            echo "Reinstalled canonical runtime backgrounds after preparation."
          fi

          if compgen -G "$GITHUB_WORKSPACE/ci/runtime_characters/*/base.webp" > /dev/null; then
            COUNT=0
            for src in "$GITHUB_WORKSPACE"/ci/runtime_characters/*/base.webp; do
              CHAR_ID="$(basename "$(dirname "$src")")"
              DEST="app/src/main/assets/chinese_course/media/characters/$CHAR_ID"
              mkdir -p "$DEST"
              cp "$src" "$DEST/base.webp"
              COUNT=$((COUNT + 1))
            done
            echo "Installed canonical character base masters: $COUNT"
          fi

          python3 scripts/validate_visual_assets.py
          python3 scripts/validate_visual_runtime_mapping.py
          python3 scripts/validate_visual_binaries.py
          python3 scripts/build_audio_asset_queue.py
          python3 scripts/prepare_audio_assets.py
          python3 scripts/validate_audio_assets.py
          python3 scripts/build_media_readiness_report.py

      - name: Stage visual production metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/visual-production-metadata"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python3 - "$SRC" "$OUT" <<'PY'
          from pathlib import Path
          import shutil, sys

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          tokens = ("visual", "prompt", "character", "location", "asset_queue", "bible")
          allowed = {".json", ".txt", ".md", ".yaml", ".yml"}

          copied = 0
          for p in src.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in allowed:
                  continue
              rel = p.relative_to(src)
              name = str(rel).lower()
              if not any(t in name for t in tokens):
                  continue
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
              copied += 1
          print(f"Staged {copied} visual production metadata files.")
          PY

      - name: Upload visual production metadata
        uses: actions/upload-artifact@v4
        with:
          name: visual-production-metadata
          path: ${{ runner.temp }}/visual-production-metadata/
          if-no-files-found: error
          retention-days: 30

      - name: Build personal APK
        working-directory: ${{ env.SRC }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        working-directory: ${{ env.SRC }}
        run: python3 scripts/package_apk_artifact.py app/build/outputs/apk/debug/app-debug.apk dist personal

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChineseHSK-v3.4.0-personal-apk
          path: ${{ env.SRC }}/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            ${{ env.SRC }}/VALIDATION_REPORT*.txt
            ${{ env.SRC }}/MEDIA_READINESS_REPORT*.txt
            ${{ env.SRC }}/VISUAL_ASSET_REPORT*.txt
          if-no-files-found: warn
          retention-days: 30

name: Build Chinese HSK v2 from ZIP

on:
  push:
    branches: [ main ]
    paths:
      - chinese_hsk_android_github_v2.0.0.zip
      - .github/workflows/build-from-zip.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate source ZIP
        shell: bash
        run: |
          test -f chinese_hsk_android_github_v2.0.0.zip
          unzip -t chinese_hsk_android_github_v2.0.0.zip >/dev/null
          echo "ZIP verified."

      - name: Extract source
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/chinese-hsk-v2"
          mkdir -p "$RUNNER_TEMP/chinese-hsk-v2"
          unzip -q chinese_hsk_android_github_v2.0.0.zip -d "$RUNNER_TEMP/chinese-hsk-v2"
          test -f "$RUNNER_TEMP/chinese-hsk-v2/chinese_hsk_android_github/VERSION"
          test "$(tr -d '\r\n' < "$RUNNER_TEMP/chinese-hsk-v2/chinese_hsk_android_github/VERSION")" = "2.0.0"
          echo "SRC=$RUNNER_TEMP/chinese-hsk-v2/chinese_hsk_android_github" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.6
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Compile and validate course
        working-directory: ${{ env.SRC }}
        run: |
          python3 scripts/compile_authoring.py
          python3 scripts/build_media_catalog.py
          python3 scripts/validate_content.py --strict
          python3 scripts/audit_content_quality.py
          python3 scripts/validate_app_flow.py

      - name: Install media tooling
        run: |
          python3 -m pip install --disable-pip-version-check "Pillow>=12,<13"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate media catalogs
        working-directory: ${{ env.SRC }}
        run: |
          python3 scripts/build_visual_bible.py
          python3 scripts/build_visual_asset_queue.py
          python3 scripts/prepare_visual_assets.py
          python3 scripts/validate_visual_assets.py
          python3 scripts/validate_visual_runtime_mapping.py
          python3 scripts/validate_visual_binaries.py
          python3 scripts/build_audio_asset_queue.py
          python3 scripts/prepare_audio_assets.py
          python3 scripts/validate_audio_assets.py
          python3 scripts/build_media_readiness_report.py

      - name: Build personal APK
        working-directory: ${{ env.SRC }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        working-directory: ${{ env.SRC }}
        run: python3 scripts/package_apk_artifact.py app/build/outputs/apk/debug/app-debug.apk dist personal

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChineseHSK-v2.0.0-personal-apk
          path: ${{ env.SRC }}/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            ${{ env.SRC }}/VALIDATION_REPORT*.txt
            ${{ env.SRC }}/MEDIA_READINESS_REPORT*.txt
            ${{ env.SRC }}/VISUAL_ASSET_REPORT*.txt
          if-no-files-found: warn
          retention-days: 30

name: Remove dialogue word strips from exercises

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/patch-remove-dialogue-word-strips.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Patch exercise screens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          learning = Path('chinese_hsk_android_github/app/src/main/java/com/ayhan/chineselearning/LearningScreens.kt')
          patcher = Path('ci/patch_source.py')

          text = learning.read_text(encoding='utf-8')
          original = text

          # Remove the strip only from the comprehension and selection-dialogue exercises.
          # Sentence Practice is handled separately by the existing patcher rule and must not be changed here.
          removed = text.count('            DialogueVocabularyStrip(dialogueWords)\\n')
          if removed < 2:
              raise SystemExit(f'Expected at least 2 exercise strip calls, found {removed}')
          text = text.replace('            DialogueVocabularyStrip(dialogueWords)\\n', '', 2)

          # The helper is no longer needed once Sentence Practice has already removed its own call.
          helper_pattern = re.compile(
              r'@Composable\\nprivate fun DialogueVocabularyStrip\\(words: List<VocabularyCard>\\) \\{.*?\\n\\}\\n\\nprivate enum class FreeStudyType',
              re.S,
          )
          if not helper_pattern.search(text):
              raise SystemExit('DialogueVocabularyStrip helper not found')
          text = helper_pattern.sub('private enum class FreeStudyType', text, count=1)

          if text == original:
              raise SystemExit('No LearningScreens change was produced')
          learning.write_text(text, encoding='utf-8')

          # Make the same change durable for the canonical ZIP build path.
          ps = patcher.read_text(encoding='utf-8')
          marker = 'ls = learning_screens.read_text(encoding="utf-8")\\n'
          if marker not in ps:
              raise SystemExit('patch_source LearningScreens anchor missing')

          insertion = '''\\n# Comprehension and Interactive Dialogue exercises must not show the horizontally scrollable dialogue-word strip.\\n# Sentence Practice has its own earlier removal rule; after that rule runs, these are the remaining two calls.\\nexercise_strip = "            DialogueVocabularyStrip(dialogueWords)\\n"\\nif ls.count(exercise_strip) < 2:\\n    raise SystemExit("Expected comprehension/interactive dialogue vocabulary-strip calls are missing")\\nls = ls.replace(exercise_strip, "", 2)\\n\\n# The strip helper is no longer used after Sentence Practice + the two exercise removals.\\nhelper_pattern = re.compile(\\n    r"@Composable\\nprivate fun DialogueVocabularyStrip\\(words: List\\[VocabularyCard\\]\\) \\{.*?\\n\\}\\n\\nprivate enum class FreeStudyType",\\n    re.S,\\n)\\nif not helper_pattern.search(ls):\\n    raise SystemExit("DialogueVocabularyStrip helper missing in canonical source")\\nls = helper_pattern.sub("private enum class FreeStudyType", ls, count=1)\\n'''
          if 'Comprehension and Interactive Dialogue exercises must not show' not in ps:
              ps = ps.replace(marker, marker + insertion, 1)
              patcher.write_text(ps, encoding='utf-8')

          print('Removed dialogue-word strips from comprehension and interactive dialogue screens.')
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          learning = Path('chinese_hsk_android_github/app/src/main/java/com/ayhan/chineselearning/LearningScreens.kt').read_text(encoding='utf-8')
          if 'DialogueVocabularyStrip' in learning:
              raise SystemExit('DialogueVocabularyStrip still exists in app source')
          ps = Path('ci/patch_source.py').read_text(encoding='utf-8')
          if 'Comprehension and Interactive Dialogue exercises must not show' not in ps:
              raise SystemExit('Canonical ZIP patch rule is missing')
          print('Exercise word-strip removal verified.')
          PY

      - name: Trigger main APK build and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '\n2026-10-02 15:37 TRT - removed dialogue-word strip from Comprehension and Interactive Dialogue exercises; content/question logic unchanged; SC040/SC047 untouched\nreason: explicit user request\n' >> ci/build_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chinese_hsk_android_github/app/src/main/java/com/ayhan/chineselearning/LearningScreens.kt ci/patch_source.py ci/build_trigger.txt .github/workflows/patch-remove-dialogue-word-strips.yml
          git commit -m "fix: remove dialogue word strips from comprehension exercises" --no-verify
          git rm .github/workflows/patch-remove-dialogue-word-strips.yml
          git commit -m "ci: remove temporary exercise patch workflow" --no-verify
          git push origin HEAD:main

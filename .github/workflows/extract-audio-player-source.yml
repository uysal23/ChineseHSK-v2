name: Extract audio player source snapshot

on:
  push:
    paths:
      - ".github/workflows/extract-audio-player-source.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/srcsnap"
          mkdir -p "$RUNNER_TEMP/srcsnap" ci/source_snapshot
          unzip -q chinese_hsk_android_github_v2.0.0.zip -d "$RUNNER_TEMP/srcsnap"
          SRC="$(find "$RUNNER_TEMP/srcsnap" -type d -path '*/app/src/main/java/com/ayhan/chineselearning' | head -n1)"
          test -n "$SRC"
          cp "$SRC/DialogueAudioPlayer.kt" ci/source_snapshot/DialogueAudioPlayer.kt
          cp "$SRC/MandarinTtsPlayer.kt" ci/source_snapshot/MandarinTtsPlayer.kt
          MODEL_FILE="$(grep -R -l 'data class DialogueLine' "$SRC"/*.kt | head -n1)"
          test -n "$MODEL_FILE"
          cp "$MODEL_FILE" "ci/source_snapshot/$(basename "$MODEL_FILE")"
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/source_snapshot
          if ! git diff --cached --quiet; then
            git commit -m "ci: snapshot audio player source [skip ci]"
            git push origin HEAD:main
          fi

name: Correct right-side speech bubble offset

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/patch-speech-bubbles-v4.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Correct bubble X geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci/SceneStage.kt')
          t = p.read_text(encoding='utf-8')
          old = 'val bubbleX = if (placeRight) mouthPxX + gapPx + pointerPx / 2 - bubble.width / 2 else mouthPxX - gapPx - pointerPx / 2 - bubble.width + pointer.width / 2'
          new = 'val bubbleX = if (placeRight) mouthPxX + gapPx + pointerPx / 2 else mouthPxX - gapPx - pointerPx / 2 - bubble.width + pointer.width / 2'
          if old not in t:
              raise SystemExit('speech bubble X formula not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/SceneStage.kt .github/workflows/patch-speech-bubbles-v4.yml
          git commit -m "fix: place right-side speech bubbles beside mouth" --no-verify
          git rm .github/workflows/patch-speech-bubbles-v4.yml
          git commit -m "ci: remove temporary bubble geometry workflow" --no-verify
          git push origin HEAD:main

name: Materialize unzipped app source

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/materialize-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract application source into repository
        shell: bash
        run: |
          set -euo pipefail
          ZIP="chinese_hsk_android_github_v2.0.0.zip"
          DEST="chinese_hsk_android_github"

          test -f "$ZIP"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          TMP="$RUNNER_TEMP/chinese-hsk-source"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          test -d "$TMP/chinese_hsk_android_github"
          cp -a "$TMP/chinese_hsk_android_github/." "$DEST/"

          # Generated Python bytecode is not source and should not be tracked.
          find "$DEST" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$DEST" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          test -f "$DEST/VERSION"
          test -f "$DEST/app/build.gradle.kts"
          test -d "$DEST/app/src/main"

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chinese_hsk_android_github

          if git diff --cached --quiet; then
            echo "Materialized source already matches ZIP."
            exit 0
          fi

          git commit -m "repo: materialize Android source from ZIP"
          git push origin HEAD:main

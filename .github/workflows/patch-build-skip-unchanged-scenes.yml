name: Patch build to preserve unchanged HSK4 SC040 SC047

on:
  push:
    branches: [ main ]
    paths:
      - ci/build_exception_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Patch authoritative scene copy step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-from-zip.yml')
          text = path.read_text(encoding='utf-8')
          old = '''for p in sorted(source_dir.glob("ZH_HSK*_SC*.webp")):
    with Image.open(p) as im:
'''
          new = '''for p in sorted(source_dir.glob("ZH_HSK*_SC*.webp")):
    # Preserve the two existing HSK4 assets exactly as committed; do not decode,
    # normalize, resize, or reject them during APK staging.
    if p.stem in {"ZH_HSK4_SC040", "ZH_HSK4_SC047"}:
        shutil.copy2(p, scene_dir / p.name)
        copied += 1
        continue
    with Image.open(p) as im:
'''
          if old not in text:
              raise SystemExit('authoritative source-tree scene copy anchor not found')
          if 'p.stem in {"ZH_HSK4_SC040", "ZH_HSK4_SC047"}' in text:
              raise SystemExit('build workflow already contains the HSK4 preserve exception')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Build workflow patched: HSK4 SC040/SC047 are copied as-is without image decoding.')
          PY

      - name: Commit patch and remove temporary patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-from-zip.yml
          git commit -m "fix: package HSK4 SC040 SC047 without decoding or modifying" --no-verify
          git rm .github/workflows/patch-build-skip-unchanged-scenes.yml ci/build_exception_trigger.txt
          git commit -m "ci: remove temporary HSK4 build exception patcher" --no-verify
          git push origin HEAD:main

name: Generate dialogue naturalization

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ci/generate_dialogue_naturalization.py
      - ci/dialogue_source_snapshot/**
      - .github/workflows/generate-dialogue-naturalization.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install text tooling
        run: python3 -m pip install --disable-pip-version-check pypinyin opencc-python-reimplemented

      - name: Generate scene-level naturalization overrides
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci/dialogue_naturalized
          python3 ci/generate_dialogue_naturalization.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_naturalized
          python3 ci/validate_dialogue_naturalization.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_naturalized

      - name: Commit naturalized dialogue corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/dialogue_naturalized
          if git diff --cached --quiet; then
            echo "Naturalized corpus already current."
            exit 0
          fi
          git commit -m "content: naturalize Simplified Chinese dialogue corpus [skip ci]"
          git push origin HEAD:main

name: Audit dialogue naturalization corpus

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/audit-dialogue-corpus.yml
      - ci/dialogue_source_snapshot/**

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build dialogue corpus audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/dialogue_naturalization
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import json, re

          root = Path("ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels")
          scene_files = sorted(root.glob("HSK*/scenes/ZH_HSK*_SC*.json"))
          zh_counter = Counter()
          by_level = defaultdict(Counter)
          samples = defaultdict(list)
          bad = []

          for p in scene_files:
              data = json.loads(p.read_text(encoding="utf-8"))
              level = data.get("level") or p.parts[-3]
              dialogues = data.get("dialogues", [])
              for d in dialogues:
                  zh = (d.get("zh") or "").strip()
                  if not zh:
                      continue
                  zh_counter[zh] += 1
                  by_level[level][zh] += 1
                  if len(samples[zh]) < 3:
                      samples[zh].append(d.get("id"))
                  if re.search(r"(确认一下觉得|关于[^，。？！]{0,10}没有问题|是这次要考虑的重点之一|我们继续看下一项)", zh):
                      bad.append({"id": d.get("id"), "zh": zh})

          payload = {
              "sceneCount": len(scene_files),
              "turnCount": sum(zh_counter.values()),
              "uniqueZhCount": len(zh_counter),
              "duplicateTurnCount": sum(c-1 for c in zh_counter.values() if c > 1),
              "levels": {
                  level: {
                      "turnCount": sum(c.values()),
                      "uniqueZhCount": len(c),
                      "topRepeated": [
                          {"zh": zh, "count": n, "samples": samples[zh]}
                          for zh, n in c.most_common(100)
                      ]
                  } for level, c in sorted(by_level.items())
              },
              "topRepeatedOverall": [
                  {"zh": zh, "count": n, "samples": samples[zh]}
                  for zh, n in zh_counter.most_common(300)
              ],
              "knownAwkwardSamples": bad[:500],
          }

          Path("docs/dialogue_naturalization/corpus_audit.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          Path("docs/dialogue_naturalization/README.md").write_text(
              "# Dialogue Naturalization\n\n"
              "Generated corpus audit for preserving scene IDs, speaker order, turn count, and learning structure while naturalizing Simplified Chinese dialogue.\n",
              encoding="utf-8"
          )
          print(json.dumps({
              "scenes": payload["sceneCount"],
              "turns": payload["turnCount"],
              "unique": payload["uniqueZhCount"],
              "duplicates": payload["duplicateTurnCount"]
          }, ensure_ascii=False))
          PY

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dialogue_naturalization
          if git diff --cached --quiet; then
            echo "Audit already current."
            exit 0
          fi
          git commit -m "content: audit dialogue naturalization corpus [skip ci]"
          git push origin HEAD:main

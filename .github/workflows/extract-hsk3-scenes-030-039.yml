name: Extract HSK3 Scene Metadata 030-039

on:
  push:
    paths:
      - .github/workflows/extract-hsk3-scenes-030-039.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scenes 030-039
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/hsk-src"
          mkdir -p "$RUNNER_TEMP/hsk-src"
          unzip -q chinese_hsk_android_github_v2.0.0.zip -d "$RUNNER_TEMP/hsk-src"
          SRC="$RUNNER_TEMP/hsk-src/chinese_hsk_android_github"
          python3 - "$SRC" <<'PY'
          import json, sys
          from pathlib import Path
          src=Path(sys.argv[1])
          out=[]
          for i in range(30,40):
              sid=f"ZH_HSK3_SC{i:03d}"
              p=src/"app/src/main/assets/chinese_course/levels/HSK3/scenes"/f"{sid}.json"
              d=json.loads(p.read_text(encoding="utf-8"))
              prod=d.get("production",{})
              out.append({
                "id":sid,
                "titleTr":d.get("titleTr"),
                "miniAdventureTr":d.get("miniAdventureTr"),
                "locationId":d.get("locationId"),
                "characters":prod.get("characters"),
                "timeOfDay":prod.get("timeOfDay"),
                "scenePurposeTr":prod.get("scenePurposeTr")
              })
          Path("ci/hsk3_scenes_030_039.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/hsk3_scenes_030_039.json
          git commit -m "ci: extract HSK3 scenes 030-039 [skip ci]"
          git push origin HEAD:main

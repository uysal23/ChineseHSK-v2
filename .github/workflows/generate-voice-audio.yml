name: Generate Mandarin voice pack (free/offline)

on:
  push:
    branches: [main]
    paths:
      - ".github/VOICE_SMOKE_TRIGGER"
  workflow_dispatch:
    inputs:
      scope:
        description: "SMOKE, one HSK level, or ALL"
        required: true
        default: "SMOKE"
        type: choice
        options:
          - SMOKE
          - HSK1
          - HSK2
          - HSK3
          - HSK4
          - HSK5
          - HSK6
          - ALL
      max_items:
        description: "Unique utterance limit per level. 0 = all. SMOKE always uses 12."
        required: true
        default: "0"
        type: string
      publish_release:
        description: "Publish/replace GitHub release asset after generation"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Kokoro model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-v2-${{ runner.os }}

      - name: Install free/offline voice tooling
        run: |
          python -m pip install --disable-pip-version-check "kokoro>=0.9.4" "misaki[zh]>=0.9.4" soundfile numpy
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Validate locked voice cast
        run: python ci/validate_voice_cast.py

      - name: Generate requested voice pack
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SCOPE="SMOKE"
            MAX="12"
          else
            SCOPE="${{ inputs.scope }}"
            MAX="${{ inputs.max_items }}"
          fi
          if [[ "$SCOPE" == "SMOKE" ]]; then
            LEVELS="HSK1"
            MAX="12"
          elif [[ "$SCOPE" == "ALL" ]]; then
            LEVELS="HSK1 HSK2 HSK3 HSK4 HSK5 HSK6"
          else
            LEVELS="$SCOPE"
          fi

          rm -rf voice-output
          mkdir -p voice-output

          for LEVEL in $LEVELS; do
            OUT="voice-output/$LEVEL"
            ARGS=(--level "$LEVEL" --out "$OUT")
            if [[ "$MAX" != "0" ]]; then
              ARGS+=(--max-items "$MAX")
            fi
            python ci/generate_voice_audio.py "${ARGS[@]}"
            test -s "$OUT/audio_manifest_$LEVEL.json"
            COUNT="$(find "$OUT/files/$LEVEL" -name '*.opus' | wc -l)"
            test "$COUNT" -gt 0
            echo "$LEVEL: $COUNT unique Opus files"
          done

      - name: Probe generated audio
        shell: bash
        run: |
          set -euo pipefail
          find voice-output -name '*.opus' -print0 | head -z -n 20 |             xargs -0 -r -n1 ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of compact=p=0:nk=1

      - name: Package generated voices
        run: |
          zip -q -r ChineseHSK-voice-pack-free.zip voice-output ci/voice_cast_manifest.json

      - name: Upload generated pack
        uses: actions/upload-artifact@v4
        with:
          name: ChineseHSK-voice-pack-${{ inputs.scope }}
          path: ChineseHSK-voice-pack-free.zip
          retention-days: 14
          compression-level: 0

      - name: Publish release asset
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view voice-pack-free >/dev/null 2>&1; then
            gh release upload voice-pack-free ChineseHSK-voice-pack-free.zip --clobber
          else
            gh release create voice-pack-free ChineseHSK-voice-pack-free.zip               --title "Chinese HSK Offline Voice Pack — Free Kokoro Mandarin"               --notes "Free/offline Kokoro Mandarin voice pack. No paid API keys are used."
          fi

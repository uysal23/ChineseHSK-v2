name: Validate native Mandarin v13 merge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-native-v13.yml"
      - "ci/apply_dialogue_v13_to_course.py"
      - "ci/dialogue_final_v13/**"
      - "ci/audit_native_mandarin_quality.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and apply v13 in temporary checkout
        run: |
          python ci/apply_dialogue_v13_to_course.py
          python ci/apply_dialogue_v13_to_course.py --apply

      - name: Validate course invariants
        run: |
          python chinese_hsk_android_github/scripts/validate_content.py
          (cd chinese_hsk_android_github && python scripts/validate_app_flow.py)

      - name: Run native Mandarin corpus QA after merge
        run: python ci/audit_native_mandarin_quality.py

      - name: Require zero FAIL scenes
        run: |
          python - <<'PY'
          import json
          d=json.load(open("native_mandarin_qa_report.json",encoding="utf-8"))
          print(json.dumps(d["totals"],ensure_ascii=False))
          print(json.dumps(d["byLevel"],ensure_ascii=False))
          if d["totals"]["fail"] != 0:
              raise SystemExit(f"FAIL scenes remain: {d['totals']['fail']}")
          PY

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v13-merge-validation
          path: |
            native_mandarin_qa_report.json
            native_mandarin_qa_report.md
          retention-days: 14

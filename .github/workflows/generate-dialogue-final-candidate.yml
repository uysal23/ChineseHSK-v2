name: Generate dialogue final candidate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ci/generate_dialogue_naturalization_v2.py
      - ci/score_dialogue_coherence.py
      - ci/validate_dialogue_naturalization.py
      - .github/workflows/generate-dialogue-final-candidate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install language tooling
        run: python3 -m pip install --disable-pip-version-check jieba pypinyin
      - name: Generate final candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci/dialogue_final_candidate
          python3 ci/generate_dialogue_naturalization_v2.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_naturalized             ci/dialogue_final_candidate
          python3 ci/validate_dialogue_naturalization.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_final_candidate
          python3 ci/score_dialogue_coherence.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_final_candidate
      - name: Commit final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/dialogue_final_candidate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: generate scene-coherent dialogue final candidate [skip ci]"
          git push origin HEAD:main

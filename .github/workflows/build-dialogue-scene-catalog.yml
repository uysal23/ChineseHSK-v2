name: Build dialogue scene catalog

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/build-dialogue-scene-catalog.yml

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels")
          out=[]
          for p in sorted(root.glob("HSK*/scenes/ZH_HSK*_SC*.json")):
              d=json.loads(p.read_text(encoding="utf-8"))
              out.append({
                  "id":d["id"],"level":d["level"],
                  "titleZh":d.get("titleZh"),"titleTr":d.get("titleTr"),
                  "miniAdventureTr":d.get("miniAdventureTr"),
                  "locationId":d.get("locationId"),
                  "speakers":[x.get("speaker") for x in d.get("dialogues",[])[:8]],
                  "goals":d.get("learning",{}).get("communicationGoals",[]),
                  "active":[{"zh":x.get("zh"),"tr":x.get("tr")} for x in d.get("learning",{}).get("vocabularyCards",[]) if x.get("kind")=="active"]
              })
          Path("docs/dialogue_naturalization/scene_catalog.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dialogue_naturalization/scene_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "content: build dialogue scene catalog [skip ci]"
            git push origin HEAD:main
          fi

name: Verify runtime Mandarin voice consistency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-runtime-voice.yml"
      - "ci/verify_runtime_voice_consistency.py"
      - "ci/voice_cast_manifest.json"
      - "chinese_hsk_android_github/app/src/main/assets/chinese_course/characters.json"
      - "chinese_hsk_android_github/app/src/main/assets/chinese_course/voices.json"
      - "chinese_hsk_android_github/app/src/main/assets/chinese_course/levels/**"
      - "chinese_hsk_android_github/app/src/main/java/com/ayhan/chineselearning/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify all 300 scenes and runtime voice paths
        run: python ci/verify_runtime_voice_consistency.py

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-voice-verification
          path: voice_runtime_verification.json
          retention-days: 14

name: Remove dialogue word strips from exercises v2

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/patch-remove-dialogue-word-strips-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Patch exercise screens and canonical build patcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          learning = Path('chinese_hsk_android_github/app/src/main/java/com/ayhan/chineselearning/LearningScreens.kt')
          patcher = Path('ci/patch_source.py')
          text = learning.read_text(encoding='utf-8')

          call = 'DialogueVocabularyStrip(dialogueWords)'
          count = text.count(call)
          if count < 2:
              raise SystemExit(f'Expected at least 2 dialogue-word strip calls, found {count}')

          # Sentence Practice has already been handled by the existing patcher rule.
          # Remove the remaining two occurrences: Comprehension and Interactive Dialogue.
          text = text.replace(call, '', 2)

          helper_pattern = re.compile(
              r'@Composable\nprivate fun DialogueVocabularyStrip\(words: List<VocabularyCard>\) \{.*?\n\}\n\nprivate enum class FreeStudyType',
              re.S,
          )
          if not helper_pattern.search(text):
              raise SystemExit('DialogueVocabularyStrip helper not found')
          text = helper_pattern.sub('private enum class FreeStudyType', text, count=1)
          learning.write_text(text, encoding='utf-8')

          # Apply the same change when build-from-zip extracts its canonical source ZIP.
          ps = patcher.read_text(encoding='utf-8')
          marker = 'ls = learning_screens.read_text(encoding="utf-8")\n'
          if marker not in ps:
              raise SystemExit('patch_source LearningScreens anchor missing')

          rule_marker = '# Comprehension and Interactive Dialogue exercises must not show the horizontally scrollable dialogue-word strip.'
          if rule_marker not in ps:
              insertion = '''
# Comprehension and Interactive Dialogue exercises must not show the horizontally scrollable dialogue-word strip.
# Sentence Practice has its own earlier removal rule; after that rule runs, these are the remaining two calls.
exercise_strip = "DialogueVocabularyStrip(dialogueWords)"
if ls.count(exercise_strip) < 2:
    raise SystemExit("Expected comprehension/interactive dialogue vocabulary-strip calls are missing")
ls = ls.replace(exercise_strip, "", 2)

# The strip helper is no longer used after Sentence Practice + the two exercise removals.
helper_pattern = re.compile(
    r"@Composable\nprivate fun DialogueVocabularyStrip\(words: List\[VocabularyCard\]\) \{.*?\n\}\n\nprivate enum class FreeStudyType",
    re.S,
)
if not helper_pattern.search(ls):
    raise SystemExit("DialogueVocabularyStrip helper missing in canonical source")
ls = helper_pattern.sub("private enum class FreeStudyType", ls, count=1)
'''
              ps = ps.replace(marker, marker + insertion, 1)
              patcher.write_text(ps, encoding='utf-8')

          print('Exercise dialogue-word strip removal patched in source and canonical ZIP patcher.')
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          learning = Path('chinese_hsk_android_github/app/src/main/java/com/ayhan/chineselearning/LearningScreens.kt').read_text(encoding='utf-8')
          if 'DialogueVocabularyStrip' in learning:
              raise SystemExit('DialogueVocabularyStrip still exists in app source')
          ps = Path('ci/patch_source.py').read_text(encoding='utf-8')
          if 'Comprehension and Interactive Dialogue exercises must not show' not in ps:
              raise SystemExit('Canonical ZIP patch rule is missing')
          print('Validated: comprehension and interactive dialogue word strips removed.')
          PY

      - name: Trigger main APK build and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          printf '\n2026-10-02 15:37 TRT - removed dialogue-word strip from Comprehension and Interactive Dialogue exercises; question/content logic unchanged; SC040/SC047 untouched\nreason: explicit user request\n' >> ci/build_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chinese_hsk_android_github/app/src/main/java/com/ayhan/chineselearning/LearningScreens.kt ci/patch_source.py ci/build_trigger.txt .github/workflows/patch-remove-dialogue-word-strips.yml .github/workflows/patch-remove-dialogue-word-strips-v2.yml
          git commit -m "fix: remove dialogue word strips from comprehension and selection exercises" --no-verify
          git rm .github/workflows/patch-remove-dialogue-word-strips.yml .github/workflows/patch-remove-dialogue-word-strips-v2.yml
          git commit -m "ci: remove temporary exercise patch workflows" --no-verify
          git push origin HEAD:main

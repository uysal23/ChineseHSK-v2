name: Generate dialogue final v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ci/generate_dialogue_final_v3.py
      - ci/validate_dialogue_final.py
      - .github/workflows/generate-dialogue-final-v3.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install language tooling
        run: python3 -m pip install --disable-pip-version-check jieba pypinyin
      - name: Generate and validate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci/dialogue_final
          python3 ci/generate_dialogue_final_v3.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_final_candidate             ci/dialogue_final
          python3 ci/validate_dialogue_naturalization.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_final
          python3 ci/validate_dialogue_final.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_final
          python3 ci/score_dialogue_coherence.py             ci/dialogue_source_snapshot/app/src/main/assets/chinese_course/levels             ci/dialogue_final
      - name: Commit final corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/dialogue_final
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: finalize scene-coherent dialogue corpus [skip ci]"
          git push origin HEAD:main

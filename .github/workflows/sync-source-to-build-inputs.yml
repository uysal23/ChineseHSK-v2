name: Sync materialized source to build inputs

on:
  push:
    branches: [ main ]
    paths:
      - 'chinese_hsk_android_github/**'
      - '.github/workflows/sync-source-to-build-inputs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chinese-hsk-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install visual validation tooling
        run: python -m pip install --disable-pip-version-check 'Pillow>=12,<13'

      - name: Materialize pending scene image chunks
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/chinese_hsk_android_github"
          CHUNK_ROOT="$PROJECT/visual_sources/scene_chunks"
          SCENE_DIR="$PROJECT/app/src/main/assets/chinese_course/media/scenes"
          mkdir -p "$SCENE_DIR"

          if [ -d "$CHUNK_ROOT" ]; then
            shopt -s nullglob
            for dir in "$CHUNK_ROOT"/ZH_HSK*_SC*; do
              [ -d "$dir" ] || continue
              scene_id="$(basename "$dir")"
              chunks=("$dir"/chunk-*.b64)
              [ "${#chunks[@]}" -gt 0 ] || continue
              cat "${chunks[@]}" | base64 -d > "$SCENE_DIR/$scene_id.webp"
              echo "Materialized $scene_id.webp from ${#chunks[@]} chunks."
            done
            rm -rf "$CHUNK_ROOT"
          fi

      - name: Validate locked scene visual policy
        run: |
          python chinese_hsk_android_github/scripts/validate_scene_visual_overrides.py \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Refresh legacy build ZIP from authoritative source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f chinese_hsk_android_github_v2.0.0.zip.new
          zip -q -r chinese_hsk_android_github_v2.0.0.zip.new chinese_hsk_android_github
          mv chinese_hsk_android_github_v2.0.0.zip.new chinese_hsk_android_github_v2.0.0.zip
          unzip -t chinese_hsk_android_github_v2.0.0.zip >/dev/null
          echo "Legacy ZIP mirror refreshed from materialized source."

      - name: Mirror direct source scene visuals into current v3.4 runtime overrides
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="chinese_hsk_android_github/app/src/main/assets/chinese_course/media/scenes"
          TARGET_DIR="ci/runtime_visuals"
          IDS_FILE="ci/source_scene_override_ids.txt"
          mkdir -p "$TARGET_DIR"

          if [ -f "$IDS_FILE" ]; then
            while IFS= read -r scene_id; do
              [ -n "$scene_id" ] || continue
              rm -f "$TARGET_DIR/$scene_id.webp"
            done < "$IDS_FILE"
          fi

          : > "$IDS_FILE"
          if compgen -G "$SOURCE_DIR/*.webp" > /dev/null; then
            for src in "$SOURCE_DIR"/*.webp; do
              scene_id="$(basename "$src" .webp)"
              cp "$src" "$TARGET_DIR/$scene_id.webp"
              echo "$scene_id" >> "$IDS_FILE"
            done
            sort -u -o "$IDS_FILE" "$IDS_FILE"
          fi
          echo "Mirrored $(wc -l < "$IDS_FILE") authoritative source scene visuals."

      - name: Commit synchronized build inputs without triggering APK build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A chinese_hsk_android_github chinese_hsk_android_github_v2.0.0.zip ci/runtime_visuals ci/source_scene_override_ids.txt
          if git diff --cached --quiet; then
            echo 'Build inputs already synchronized.'
            exit 0
          fi
          git commit -m 'repo: sync authoritative source to legacy build inputs [skip ci]'
          git push origin HEAD:main

name: Build Personal APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: chinese-hsk-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Compile authoring content
        run: python3 scripts/compile_authoring.py

      - name: Build media catalogs
        run: python3 scripts/build_media_catalog.py

      - name: Install Python image tooling
        run: python3 -m pip install --disable-pip-version-check "Pillow>=12,<13"

      - name: Build visual bible and production queue
        run: |
          python3 scripts/build_visual_bible.py
          python3 scripts/build_visual_asset_queue.py
          python3 scripts/prepare_visual_assets.py
          python3 scripts/validate_visual_assets.py
          python3 scripts/validate_visual_runtime_mapping.py
          python3 scripts/validate_visual_binaries.py

      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build and validate audio assets
        run: |
          python3 scripts/build_audio_asset_queue.py
          python3 scripts/prepare_audio_assets.py
          python3 scripts/validate_audio_assets.py
          python3 scripts/build_media_readiness_report.py

      - name: Strict content validation
        run: python3 scripts/validate_content.py --strict

      - name: Audit complete-scene content quality
        run: python3 scripts/audit_content_quality.py

      - name: Validate app user flow
        run: python3 scripts/validate_app_flow.py

      - name: Detect stable release signing
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chinese-hsk-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/chinese-hsk-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build personal debug APK
        if: steps.signing.outputs.enabled != 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Package signed APK artifact
        if: steps.signing.outputs.enabled == 'true'
        run: python3 scripts/package_apk_artifact.py app/build/outputs/apk/release/app-release.apk dist release

      - name: Package debug APK artifact
        if: steps.signing.outputs.enabled != 'true'
        run: python3 scripts/package_apk_artifact.py app/build/outputs/apk/debug/app-debug.apk dist personal

      - name: APK build summary
        if: always()
        shell: bash
        run: |
          echo "## Chinese HSK APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Course validation: HSK1-HSK6 strict" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable release signing: ${{ steps.signing.outputs.enabled }}" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "dist/*.apk" > /dev/null; then
            echo "- APK artifact created successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- Download it from the Artifacts section at the bottom of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- APK was not produced. Download validation-reports and inspect the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChineseHSK-personal-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            VALIDATION_REPORT*.txt
            MEDIA_READINESS_REPORT*.txt
            VISUAL_ASSET_REPORT*.txt
          if-no-files-found: warn
          retention-days: 30

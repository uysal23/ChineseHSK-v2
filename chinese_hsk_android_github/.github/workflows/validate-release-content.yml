name: Validate Full Course

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile authoring content
        run: python3 scripts/compile_authoring.py

      - name: Build media catalogs
        run: python3 scripts/build_media_catalog.py

      - name: Install Python image tooling
        run: python3 -m pip install --disable-pip-version-check "Pillow>=12,<13"

      - name: Build visual bible and prompt catalog
        run: python3 scripts/build_visual_bible.py

      - name: Build visual production queue
        run: python3 scripts/build_visual_asset_queue.py

      - name: Prepare optimized WebP visual assets
        run: python3 scripts/prepare_visual_assets.py

      - name: Validate visual asset catalog
        run: python3 scripts/validate_visual_assets.py

      - name: Validate visual runtime mapping
        run: python3 scripts/validate_visual_runtime_mapping.py

      - name: Validate generated visual binaries
        run: python3 scripts/validate_visual_binaries.py

      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build audio production queue
        run: python3 scripts/build_audio_asset_queue.py

      - name: Prepare optimized Opus audio assets
        run: python3 scripts/prepare_audio_assets.py

      - name: Validate audio assets
        run: python3 scripts/validate_audio_assets.py

      - name: Build media readiness report
        run: python3 scripts/build_media_readiness_report.py

      - name: Strict content validation
        run: python3 scripts/validate_content.py --strict

      - name: Audit complete-scene content quality
        run: python3 scripts/audit_content_quality.py

      - name: Validate app user flow
        run: python3 scripts/validate_app_flow.py
